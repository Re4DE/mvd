log_format custom '$remote_addr - $ssl_client_s_dn - $ssl_client_verify - $ssl_client_cert - $ssl_client_escaped_cert';
access_log /var/log/nginx/access.log custom;

upstream keycloak_backend {
    server keycloak:8080;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;

    server_name _;

    ssl_certificate     /etc/nginx/auth/keycloak.crt;
    ssl_certificate_key /etc/nginx/auth/keycloak.key;

    ssl_verify_client       on;
    ssl_verify_depth        2;
    ssl_client_certificate  /etc/nginx/auth/sub-ca.crt;
    ssl_trusted_certificate /etc/nginx/auth/ca.crt;

    ssl_protocols               TLSv1.3;
    ssl_ciphers                 HIGH:!aNULL:!MD5;
    ssl_ecdh_curve              brainpoolP256r1tls13:brainpoolP384r1tls13:brainpoolP512r1tls13;
    ssl_prefer_server_ciphers   on;

    location / {
        proxy_set_header Host               $host;
        proxy_set_header X-Forwarded-For    $remote_addr;
        proxy_set_header X-Forwarded-Host   $host;
        proxy_set_header X-Forwarded-Port   443;
        proxy_set_header X-Forwarded-Proto  https;

        proxy_set_header X-Original-URI     $request_uri;
        proxy_set_header X-Request-ID       $request_id;
        proxy_set_header X-Real-IP          $remote_addr;

        proxy_set_header X-Client-Cert      $ssl_client_escaped_cert;
        proxy_set_header ssl-client-verify  $ssl_client_verify;

        proxy_pass http://keycloak_backend$request_uri;
    }
}