name: re4de-central-services-x509

volumes:
  postgres_data:
  mongo_data:

networks:
  dataspace-net:
    external: true
    name: dataspace-net

services:
  # Keycloak + Nginx + Database
  keycloak:
    image: keycloak/keycloak:26.5.4
    ports:
      - "8080:8080"
    networks:
      - default
      - dataspace-net
    command: start-dev --import-realm
    depends_on:
      postgresql:
        condition: service_healthy
        restart: true
    environment:
      KC_HEALTH_ENABLED: true
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: devpass
      KC_DB: postgres
      KC_DB_USERNAME: keycloak  
      KC_DB_PASSWORD: devpass
      KC_DB_URL: jdbc:postgresql://postgresql:5432/keycloak
      KC_HOSTNAME_STRICT: false
      KC_HTTPS_CLIENT_AUTH: request
      KC_HTTP_ENABLED: true
      KC_HTTPS_ENABLED: false
      KC_PROXY_HEADERS: xforwarded
      KC_SPI_X509CERT_LOOKUP__PROVIDER: nginx
      KC_SPI_X509CERT_LOOKUP__NGINX__SSL_CLIENT_CERT: X-Client-Cert
      KC_SPI_X509CERT_LOOKUP__NGINX__CERTIFICATE_CHAIN_LENGTH: 0
      KC_SPI_X509CERT_LOOKUP__NGINX__TRUST_PROXY_VERIFICATION: true
    healthcheck:
      test: ["CMD-SHELL", "{ printf 'HEAD /health/ready HTTP/1.0\r\n\r\n' >&0; grep 'HTTP/1.0 200'; } 0<>/dev/tcp/localhost/9000"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 30s
    volumes:
      - "./config/keycloak/realm-import.json:/opt/keycloak/data/import/realm-import.json"
      - "./config/certs/sub-ca.crt:/opt/keycloak/conf/truststores/sub-ca.crt"
      - "./config/certs/ca.crt:/opt/keycloak/conf/truststores/ca.crt"

  nginx:
    image: nginx:1.30.4-alpine
    networks:
      - default
      - dataspace-net
    depends_on:
      keycloak:
        condition: service_healthy
        restart: true
    volumes:
      - "./config/nginx/keycloak.conf:/etc/nginx/conf.d/keycloak.conf"
      - "./config/certs/ca.crt:/etc/nginx/auth/ca.crt"
      - "./config/certs/sub-ca.crt:/etc/nginx/auth/sub-ca.crt"
      - "./config/certs/keycloak.crt:/etc/nginx/auth/keycloak.crt"
      - "./config/certs/keycloak.key:/etc/nginx/auth/keycloak.key"

  postgresql:
    image: postgres:18.2-alpine3.23
    networks:
      - default
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: devpass
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 30s
    volumes:
      - "postgres_data:/var/lib/postgresql/18/docker"

  # Connector Registry + Database
  connector-registry:
    image: ghcr.io/re4de/connector-registry:1.1.0-edc0.14.0
    ports:
      - "3000:3000"
    networks:
      - default
      - dataspace-net
    environment:
      MONGO_HOST: mongodb
    depends_on:
      mongodb:
        condition: service_healthy
        restart: true

  mongodb:
    image: mongo:8.2.5-noble
    networks:
      - default
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: devpass
      MONGO_INITDB_DATABASE: registry
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "echo 'db.runCommand({serverStatus:1}).ok' | mongosh admin -u $${MONGO_INITDB_ROOT_USERNAME} -p $${MONGO_INITDB_ROOT_PASSWORD} | grep 1",
        ]
      interval: 10s
      timeout: 15s
      retries: 5
      start_period: 30s
    volumes:
      - mongo_data:/data/db
      - ./config/mongo/init-mongo.js:/docker-entrypoint-initdb.d/init-mongo.js:ro
